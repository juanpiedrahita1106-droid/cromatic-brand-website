<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Cromatic Brand</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>
        .checkout-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .checkout-box {
            background: var(--card-bg);
            padding: 2rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .order-summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .order-summary-item img {
            width: 50px;
            height: 60px;
            object-fit: cover;
            margin-right: 1rem;
        }

        .order-total {
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            margin-top: 1rem;
            color: var(--accent-color);
        }

        @media (max-width: 768px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="icon" type="image/png" href="assets/img/Logo Camaleon.png">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                <img src="assets/img/Logo cromatic.png" alt="Cromatic Logo">
            </a>
            
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="section">
            <h1 class="section-title">Finalizar Compra</h1>
            
            <div class="checkout-container">
                <!-- Formulario de datos -->
                <div class="checkout-box">
                    <h2>Datos de Envío</h2>
                    <form onsubmit="event.preventDefault(); processCheckout();">
                        <div class="form-group">
                            <label>Nombre Completo</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Correo Electrónico</label>
                            <input type="email" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Dirección de Envío</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Ciudad</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Teléfono</label>
                            <input type="text" class="form-control" required>
                        </div>
                        
                        <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;"><i class="fab fa-whatsapp" style="margin-right: 8px;"></i> Enviar Pedido por WhatsApp</button>
                    </form>
                </div>

                <!-- Resumen de compra -->
                <div class="checkout-box">
                    <h2>Resumen del Pedido</h2>
                    <div id="checkout-summary" style="margin-top: 1rem;">
                        <!-- JS generará el contenido -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', renderSummary);

        function renderSummary() {
            const summaryContainer = document.getElementById('checkout-summary');
            const cart = getCart();

            if (cart.length === 0) {
                summaryContainer.innerHTML = '<p>No hay productos en el pedido.</p>';
                return;
            }

            let html = '';
            let total = 0;

            cart.forEach(item => {
                const subtotal = item.price * item.quantity;
                total += subtotal;
                html += `
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; color: var(--accent-color);">
                        <span>${item.quantity}x ${item.title} ${item.size ? `(Talla ${item.size})` : ''}</span>
                        <span>$${subtotal.toLocaleString('es-CO')} COP</span>
                    </div>
                `;
            });

            html += `
                <div class="order-total">
                    <span>Total:</span>
                    <span style="color: white;">$${total.toLocaleString('es-CO')} COP</span>
                </div>
            `;

            summaryContainer.innerHTML = html;
        }

        function processCheckout() {
            const inputs = document.querySelectorAll('input[required]');
            let isValid = true;
            inputs.forEach(input => {
                if (!input.value) isValid = false;
            });

            if (!isValid) return;

            const name = inputs[0].value;
            const email = inputs[1].value;
            const address = inputs[2].value;
            const city = inputs[3].value;
            const phone = inputs[4].value;

            const cart = getCart();
            if(cart.length === 0) {
                alert('El carrito está vacío');
                return;
            }

            let orderItems = '';
            let total = 0;
            cart.forEach(item => {
                const sub = item.price * item.quantity;
                total += sub;
                orderItems += `- ${item.quantity}x ${item.title} ${item.size ? `(Talla ${item.size})` : ''} - $${sub.toLocaleString('es-CO')} COP\n`;
            });

            const msg = `¡Hola Cromatic! Quiero hacer el siguiente pedido:\n\n*DATOS DE ENVÍO:*\nNombre: ${name}\nTeléfono: ${phone}\nDirección: ${address}, ${city}\nCorreo: ${email}\n\n*MI PEDIDO:*\n${orderItems}\n*TOTAL: $${total.toLocaleString('es-CO')} COP*\n\nQuedo atento a las instrucciones para el pago.`;
            
            const waUrl = `https://wa.me/573128917257?text=${encodeURIComponent(msg)}`;
            
            // Empty cart after routing to WhatsApp
            saveCart([]);
            window.location.href = waUrl;
        }
    </script>
</body>
</html>
